[package]
name = "kronos-rs"
version = "0.1.0"
edition = "2021"
description = "Offline Rust inference for the Kronos financial candlestick model"
license = "MIT"
publish = false

[lib]
name = "kronos"
path = "src/lib.rs"

[[bin]]
name = "kronos"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
